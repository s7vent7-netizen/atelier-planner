<script>
(function(){'use strict';var KEY='planificateur_atelier_tizen_v2';var $=function(x){return document.getElementById(x)};var esc=function(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};var pad=function(x){return ('0'+x).slice(-2)};var iso=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};var date=function(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2],12)};var add=function(s,n){var d=date(s);d.setDate(d.getDate()+n);return iso(d)};var monday=function(s){var d=date(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return iso(d)};var monthStart=function(s){return s.slice(0,7)+'-01'};var daysInMonth=function(s){var d=date(monthStart(s));return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()};var label=function(s){return date(s).toLocaleDateString('fr-BE',{weekday:'short',day:'numeric',month:'short'})};var week=function(s){var d=date(s);d.setHours(12);d.setDate(d.getDate()+4-(d.getDay()||7));var y=new Date(d.getFullYear(),0,1,12);return Math.ceil((((d-y)/86400000)+1)/7)};var uid=function(){return 'M'+Date.now()+Math.random().toString(36).slice(2,6)};var defaults=function(){return {version:2,techs:[{id:'t1',name:'RAMI Achraf',color:'#F0802D'},{id:'t2',name:'COËME Romain',color:'#D50909'},{id:'t3',name:'Technicien 3',color:'#1874BC'}],clients:[{id:'c1',name:'Client Exemple',short:'EXEMPLE',sites:['Bruxelles'],contacts:[{id:'p1',name:'Jean Dupont'}]}],missions:[],atelier:[],atelierAssignments:[]}};var db=defaults(),storageOK=true,tab='missions',period='week',focus=iso(new Date()),zoom=100,selected=null,mode='consultation',atelierArchive=false;try{var raw=localStorage.getItem(KEY);if(raw){var parsed=JSON.parse(raw);if(parsed&&Array.isArray(parsed.techs)&&Array.isArray(parsed.clients)&&Array.isArray(parsed.missions)&&Array.isArray(parsed.atelier))db=parsed}if(!Array.isArray(db.atelierAssignments))db.atelierAssignments=[];localStorage.setItem('__test_planif','1');localStorage.removeItem('__test_planif')}catch(e){storageOK=false}function save(){try{localStorage.setItem(KEY,JSON.stringify(db));storageOK=true;return true}catch(e){storageOK=false;alert('Échec de la sauvegarde locale. Les modifications risquent d’être perdues.');return false}}function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(function(){$('toast').style.display='none'},2200)}function status(m){return m.cancelled?'cancel':m.confirmed?'confirm':'planned'}function icon(m){return '<span class="status '+(status(m)==='confirm'?'confirm':status(m)==='cancel'?'cancel':'')+'">'+(m.cancelled?'✕':'✓')+'</span>'}function tech(id){return db.techs.find(function(t){return t.id===id})||{name:'Non attribué',color:'#64748b'}}function client(id){return db.clients.find(function(c){return c.id===id})||{name:'Client inconnu',short:'CLIENT',sites:[],contacts:[]}}function dateRange(){if(period==='week'){var s=monday(focus);return [s,add(s,6)]}if(period==='month'){var a=monthStart(focus);return [a,add(a,daysInMonth(a)-1)]}var d=date(monthStart(focus));d.setMonth(d.getMonth()+3);return [monthStart(focus),add(iso(d),-1)]}function overlaps(m,a,b){return m.start<=b&&(m.end||m.start)>=a}function card(m){var c=client(m.clientId),t=tech(m.techId);return '<div class="card" data-view="'+esc(m.id)+'" style="border-color:'+esc(t.color)+'"><strong>'+icon(m)+esc(c.short||c.name)+'</strong><p>'+esc(t.name)+' · '+esc(m.start)+(m.end!==m.start?' → '+esc(m.end):'')+'</p><p>'+esc(m.assignment==='atelier'?'Travail en atelier':'Mission extérieure')+' · '+esc(m.type)+' · '+esc(m.description||'—')+'</p></div>'}function topMissions(){var upcoming=db.missions.filter(function(m){return m.end>=iso(new Date())&&!m.cancelled}).sort(function(a,b){return a.start.localeCompare(b.start)}).slice(0,6);return '<div class="top"><section class="panel"><h2>Commandes</h2><div class="mission-actions"><div class="buttons"><button class="primary" id="newMission">＋ Nouvelle mission</button><button id="editMission" '+(!selected?'disabled':'')+'>Modifier la mission</button><button class="danger" id="deleteMission" '+(!selected?'disabled':'')+'>Supprimer la mission</button></div><button id="openTasks" class="tasks-side">Tâches Atelier</button></div><p class="muted">Mode consultation : touchez une mission pour afficher sa fiche. Les modifications nécessitent le bouton « Modifier ».</p></section><section class="panel"><h2>'+(selected?'Fiche de mission':'Prochaines missions')+'</h2>'+(selected?details(db.missions.find(function(m){return m.id===selected})):upcoming.length?'<div class="cards">'+upcoming.map(card).join('')+'</div>':'<p class="muted">Aucune mission à venir.</p>')+'</section></div>'}function details(m){if(!m)return '<p>Mission introuvable.</p>';var c=client(m.clientId),t=tech(m.techId);return '<p><strong style="color:'+esc(t.color)+'">'+esc(t.name)+'</strong> · '+icon(m)+(m.cancelled?'ANNULÉE':m.confirmed?'CONFIRMÉ':'PRÉVU')+'</p><p><b>SEMAINE :</b> '+week(m.start)+' · <b>DATES :</b> '+esc(m.start)+' → '+esc(m.end)+'</p><p><b>OÙ ?</b> '+esc(c.name)+' / '+esc(m.site)+'</p><p><b>QUOI ?</b> '+esc(m.type)+' — '+esc(m.description)+'</p><p><b>CONTACT / CLIENT :</b> '+esc(m.contact)+'</p><p><b>À PRÉVOIR / CONTRAINTES :</b> '+esc(m.constraints)+'</p>'+(m.cancelled?'<p class="notice">Annulée le '+esc(m.cancelledAt||'—')+' · Motif : '+esc(m.cancelReason||'non précisé')+'</p>':'')}function timeline(){var range=dateRange(),start=range[0],end=range[1],n=Math.round((date(end)-date(start))/86400000)+1;var cols='';for(var i=0;i<n;i++){var d=add(start,i);cols+='<span>'+((period==='week'||i%5===0||i===n-1)?esc(label(d)):'·')+'</span>'}var rows=db.techs.map(function(t){var bars=db.missions.filter(function(m){return m.techId===t.id&&overlaps(m,start,end)}).map(function(m){var first=Math.max(0,Math.round((date(m.start)-date(start))/86400000));var last=Math.min(n-1,Math.round((date(m.end)-date(start))/86400000));var left=first/n*100,width=Math.max(1,(last-first+1)/n*100);var c=client(m.clientId),isAtelier=m.assignment==='atelier';return '<div class="bar'+(isAtelier?' atelier-affectation':'')+'" data-view="'+esc(m.id)+'" title="'+esc(isAtelier?'Travail en atelier : '+(m.description||m.type):c.name)+'" style="left:'+left+'%;width:'+width+'%;background:'+esc(t.color)+';--tech-color:'+esc(t.color)+'">'+icon(m)+esc(isAtelier?(m.description||'Atelier'):(c.short||c.name))+'</div>'}).join('');bars+=(db.atelierAssignments||[]).filter(function(a){return a.techId===t.id&&overlaps(a,start,end)}).map(function(a){var first=Math.max(0,Math.round((date(a.start)-date(start))/86400000)),last=Math.min(n-1,Math.round((date(a.end)-date(start))/86400000)),task=db.atelier.find(function(x){return x.id===a.taskId});return '<div class="bar atelier-affectation" data-assignment="'+esc(a.id)+'" title="'+esc(task?task.title:'Tâche atelier')+'" style="left:'+(first/n*100)+'%;width:'+Math.max(1,(last-first+1)/n*100)+'%;--tech-color:'+esc(t.color)+'">'+esc(task?task.title:'Atelier')+'</div>'}).join('');return '<div class="lane"><div class="lane-name" style="color:'+esc(t.color)+'">'+esc(t.name)+'</div><div class="track">'+bars+'</div></div>'}).join('');return '<section class="panel"><div class="toolbar"><div class="row"><h2>Chronologie</h2><button id="prev">◀</button><button id="today">Aujourd’hui</button><button id="next">▶</button><strong>Semaine '+week(focus)+' · '+esc(label(start))+' — '+esc(label(end))+'</strong></div><div class="row"><button data-period="week" class="'+(period==='week'?'active':'')+'">Semaine</button><button data-period="month" class="'+(period==='month'?'active':'')+'">Mois</button><button data-period="quarter" class="'+(period==='quarter'?'active':'')+'">3 mois</button><button id="zoomOut">−</button><span>'+zoom+' %</span><button id="zoomIn">＋</button></div></div><div id="swipe" class="timeline-scroll"><div class="timeline" style="min-width:'+Math.round(950*zoom/100)+'px;--n:'+n+'"><div class="dayhead"><div class="lane-name">Technicien</div><div class="dates">'+cols+'</div></div>'+rows+'</div></div><div class="affectation-legend"><span><i class="legend-swatch legend-filled"></i>Mission extérieure · couleur pleine</span><span><i class="legend-swatch legend-outline"></i>Travail en atelier · contour coloré</span></div><p class="muted">Glissez horizontalement pour parcourir la chronologie. Les missions annulées restent visibles pour la traçabilité.</p></section>'}function render(){document.querySelectorAll('[data-tab]').forEach(function(b){b.classList.toggle('active',b.dataset.tab===tab)});if(selected&&!db.missions.some(function(m){return m.id===selected}))selected=null;if(tab==='missions')$('view').innerHTML=topMissions()+timeline();else if(tab==='accueil'){$('view').innerHTML='<div class="panel"><h2>Accueil</h2><div class="cards"><div class="card"><h3>Missions</h3><h1>'+db.missions.length+'</h1></div><div class="card"><h3>Confirmées</h3><h1>'+db.missions.filter(function(m){return m.confirmed&&!m.cancelled}).length+'</h1></div><div class="card"><h3>Annulées</h3><h1>'+db.missions.filter(function(m){return m.cancelled}).length+'</h1></div><div class="card"><h3>Atelier</h3><h1>'+db.atelier.length+'</h1></div></div></div>'}else if(tab==='taches'){$('view').innerHTML=tasksView()}else if(tab==='atelier'){var finished=db.atelier.filter(function(t){return t.state==='Terminée'});var active=db.atelier.filter(function(t){return t.state!=='Terminée'});var atelierCard=function(t){var assigned=(db.atelierAssignments||[]).filter(function(a){return a.taskId===t.id});return '<div class="card" data-at="'+esc(t.id)+'"><strong>'+esc(t.title)+'</strong><p>'+esc(t.state)+' · Arrivée : '+esc(t.date||'Non renseignée')+'</p>'+(t.completedAt?'<p>Terminée le : '+esc(t.completedAt.slice(0,10))+'</p>':'')+'<p>'+esc(t.notes||'')+'</p><p class="muted">'+esc(assigned.map(function(a){return tech(a.techId).name+' ('+a.start+' → '+a.end+')'}).join(' ; ')||'Non affectée')+'</p></div>'};var shown=atelierArchive?finish
